workflows:
  physx-jni-probe:
    name: PhysX JNI probe and build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clone and collect build files
        script: |
          git clone --recursive https://github.com/fabmax/physx-jni.git
          mkdir -p probe
          cd physx-jni
          find . -type f -not -path "./PhysX/*" -not -path "./.git/*" > ../probe/files.txt
          ls -R PhysX/physx/buildtools/presets > ../probe/presets_list.txt || true
          cp -R PhysX/physx/buildtools/presets ../probe/presets || true
          tar czf ../probe/repo_src.tgz \
            --exclude=PhysX --exclude=.git \
            --exclude='*.dylib' --exclude='*.so' --exclude='*.dll' \
            --exclude='*.jar' --exclude='*.aar' --exclude=build .
      - name: Build macOS (test)
        script: |
          cd physx-jni
          ./gradlew generateNativeProject || true
          ./gradlew buildNativeProject
          ./gradlew build
    artifacts:
      - probe/**
      - physx-jni/PhysX/physx/bin/**/*.dylib
