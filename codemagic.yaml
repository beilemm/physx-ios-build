workflows:
  physx-ios:
    name: PhysX JNI iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      xcode: latest
      vars:
        PHYSX_JNI_REF: "2.5.1"
    scripts:
      - name: Clone matching physx-jni version
        script: |
          mkdir -p out
          git ls-remote --tags https://github.com/fabmax/physx-jni.git > out/tags.txt || true
          for REF in "$PHYSX_JNI_REF" "v$PHYSX_JNI_REF"; do
            rm -rf physx-jni
            if git clone --branch "$REF" --recursive https://github.com/fabmax/physx-jni.git; then
              echo "cloned $REF"; break
            fi
          done
          test -d physx-jni || { echo "TAG NOT FOUND - see out/tags.txt"; exit 1; }
          cd physx-jni
          ./gradlew :physx-jni:generateJniJavaBindings > ../out/glue.log 2>&1 || ./gradlew generateJniBindings >> ../out/glue.log 2>&1 || true
          find PhysX/physx/source/webidlbindings -name "PhysXJniGlue.h" > ../out/glue_found.txt || true
          cat ../out/glue_found.txt
      - name: Patch PhysX for iOS
        script: |
          cat > patch_ios.py <<'PYEOF'
          import re, shutil, os, sys, glob
          root = sys.argv[1]  # PhysX/physx directory
          cm = os.path.join(root, 'source/compiler/cmake')

          def read(p): return open(p).read()
          def write(p, s): open(p, 'w').write(s)
          def fail(msg):
              print('PATCH FAILED: ' + msg); sys.exit(1)

          # 1. copy jni-mac -> jni-ios
          src_dir = os.path.join(cm, 'jni-mac')
          if not os.path.isdir(src_dir): fail('no jni-mac cmake dir')
          dst = os.path.join(cm, 'jni-ios')
          if os.path.exists(dst): shutil.rmtree(dst)
          shutil.copytree(src_dir, dst)

          # 2. jni-ios/CMakeLists.txt : include own bindings file, drop -Werror
          p = os.path.join(dst, 'CMakeLists.txt'); s = read(p)
          s, n = re.subn(r'jni-mac/PhysXJniBindings\.cmake', 'jni-ios/PhysXJniBindings.cmake', s)
          if n == 0: fail('jni-mac/PhysXJniBindings.cmake include not found')
          s = re.sub(r'\s-Werror\b', '', s)
          write(p, s)

          # 3. explicit JNI include dirs (FIND_PACKAGE(JNI) breaks when cross compiling to iOS)
          p = os.path.join(dst, 'PhysXJniBindings.cmake'); s = read(p)
          s, n = re.subn(r'(?im)^[ \t]*FIND_PACKAGE\(JNI[^)]*\)',
                         'SET(JNI_INCLUDE_DIRS $ENV{JAVA_HOME}/include $ENV{JAVA_HOME}/include/darwin)', s)
          if n == 0: fail('FIND_PACKAGE(JNI) not found')
          write(p, s)

          # 4. bin dir name
          p = os.path.join(cm, 'modules/GetCompilerAndPlatform.cmake'); s = read(p)
          pat = re.compile(r'(?im)^([ \t]*)ELSEIF\(TARGET_BUILD_PLATFORM STREQUAL "jni-mac"\)')
          m = pat.search(s)
          if not m: fail('jni-mac branch not found in GetCompilerAndPlatform.cmake')
          ins = '%sELSEIF(TARGET_BUILD_PLATFORM STREQUAL "jni-ios")\n%s\tSET(RETVAL "jni-ios.aarch64")\n' % (m.group(1), m.group(1))
          s = s[:m.start()] + ins + s[m.start():]
          write(p, s)

          # 5. generator script
          p = os.path.join(root, 'buildtools/cmake_generate_projects.py'); s = read(p)
          m = re.search(r"^([ \t]*)elif self\.targetPlatform == 'jni-mac64':", s, re.M)
          if not m: fail("jni-mac64 branch not found in cmake_generate_projects.py")
          i = m.group(1)
          block = (
           i + "elif self.targetPlatform == 'jni-ios':\n" +
           i + "    outString = outString + ' -DTARGET_BUILD_PLATFORM=jni-ios'\n" +
           i + "    outString = outString + ' -DPX_OUTPUT_ARCH=arm'\n" +
           i + "    outString = outString + ' -DCMAKE_SYSTEM_NAME=iOS'\n" +
           i + "    outString = outString + ' -DCMAKE_OSX_SYSROOT=iphoneos'\n" +
           i + "    outString = outString + ' -DCMAKE_OSX_ARCHITECTURES=arm64'\n" +
           i + "    outString = outString + ' -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO'\n" +
           i + "    outString = outString + ' -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO'\n" +
           i + "    return outString\n")
          s = s[:m.start()] + block + s[m.start():]
          write(p, s)
          import ast; ast.parse(s)

          # 6. preset: derive from an existing mac preset
          pd = os.path.join(root, 'buildtools/presets/public')
          cands = [f for f in glob.glob(pd + '/jni-mac*.xml')]
          cands.sort(key=lambda f: ('aarch64' not in f))
          if not cands: fail('no jni-mac preset found')
          x = read(cands[0])
          x = re.sub(r'(<preset name=")[^"]*(")', r'\1jni-ios-arm64\2', x, count=1)
          x = re.sub(r'(targetPlatform=")[^"]*(")', r'\1jni-ios\2', x, count=1)
          x = re.sub(r'install/jni-[^/"]*/PhysX', 'install/jni-ios-arm64/PhysX', x)
          x = x.replace('value="12.0"', 'value="14.0"')
          write(os.path.join(pd, 'jni-ios-arm64.xml'), x)
          print('patched OK (preset from %s)' % os.path.basename(cands[0]))
          PYEOF
          python3 patch_ios.py physx-jni/PhysX/physx 2>&1 | tee out/patch.log
          grep -q "patched OK" out/patch.log
      - name: Generate and build iOS
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home)}"
          echo "JAVA_HOME=$JAVA_HOME"
          cd physx-jni/PhysX/physx
          ./generate_projects.sh jni-ios-arm64 2>&1 | tee ../../../out/generate.log || true
          cmake --build compiler/jni-ios-arm64 --config release --parallel 8 2>&1 | tee ../../../out/build.log || true
      - name: Collect, sign and verify
        script: |
          find physx-jni/PhysX/physx/bin -name "*.dylib" > out/found.txt || true
          cat out/found.txt
          test -s out/found.txt || { echo "NO DYLIB BUILT - see out/build.log"; exit 1; }
          while read f; do
            cp "$f" out/libPhysXJniBindings_64.dylib
          done < out/found.txt
          codesign -f -s - out/libPhysXJniBindings_64.dylib || true
          vtool -show-build out/libPhysXJniBindings_64.dylib | tee out/platform.txt || true
          otool -L out/libPhysXJniBindings_64.dylib | tee out/deps.txt || true
          nm -gU out/libPhysXJniBindings_64.dylib | grep -i "PxTopLevelFunctions" | grep -i "version" | tee out/symbols.txt || true
          if grep -q "_Java_physx_PxTopLevelFunctions__1getPHYSICS_1VERSION" out/symbols.txt; then
            echo "SYMBOL_OK" | tee out/symbol_check.txt
          else
            echo "SYMBOL_MISSING (wrong physx-jni version?)" | tee out/symbol_check.txt
          fi
    artifacts:
      - out/**
