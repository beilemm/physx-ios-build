workflows:
  physx-jni-probe:
    name: PhysX build files probe
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Collect PhysX build system
        script: |
          git clone --recursive https://github.com/fabmax/physx-jni.git
          mkdir -p probe
          cd physx-jni/PhysX/physx
          grep -rIn "macAarch64\|jni-mac" buildtools source/compiler/cmake > ../../../probe/grep_mac.txt || true
          grep -rIli "iphoneos\|ios" buildtools source/compiler/cmake > ../../../probe/grep_ios.txt || true
          ls -R buildtools source/compiler/cmake source/webidlbindings > ../../../probe/tree.txt || true
          tar czf ../../../probe/physx_build.tgz buildtools source/compiler/cmake source/webidlbindings
    artifacts:
      - probe/**
